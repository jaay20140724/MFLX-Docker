services:
  mflx:
    image: ${MFLX_IMAGE}
    restart: always
    deploy:
      resources:
        limits:
          cpus: ${CPUS}
          memory: ${MEMORY_LIMIT}
    ports:
      - ${HOST_IP}:${WEB_PORT}:8080
      - ${HOST_IP}:${API_PORT}:8570
    volumes:
      - ${APP_PATH}/data:/opt/mcpanel
    labels:
      createdBy: "bt_apps"
    networks:
      - baota_net

networks:
  baota_net:
    external: true
